name: SnapDrift Resolve Baseline
description: Resolve and download the latest successful SnapDrift baseline from main.

branding:
  icon: download-cloud
  color: purple

inputs:
  github-token:
    description: Token used to query workflow runs and download artifacts.
    required: true
  repository:
    description: Repository in owner/name format.
    required: false
    default: ''
  repo-config-path:
    description: Path to the SnapDrift config file.
    required: false
    default: .github/snapdrift.json
  artifact-name:
    description: Optional explicit baseline name override.
    required: false
    default: ''
  workflow-id:
    description: Workflow id or filename to search.
    required: false
    default: ci.yml
  branch:
    description: Branch that publishes the baseline.
    required: false
    default: main
  download-path:
    description: Directory where the artifact should be downloaded.
    required: false
    default: snapdrift-baseline-download

outputs:
  found:
    description: Whether a non-expired baseline was found.
    value: ${{ steps.resolve.outputs.found }}
  resolution-status:
    description: 'Baseline lookup status: found, missing, or error.'
    value: ${{ steps.resolve.outputs.resolution_status }}
  artifact-name:
    description: Resolved artifact name.
    value: ${{ steps.resolve.outputs.artifact_name }}
  head-sha:
    description: Head SHA of the baseline-producing run.
    value: ${{ steps.resolve.outputs.head_sha }}
  run-id:
    description: Workflow run id that produced the baseline.
    value: ${{ steps.resolve.outputs.run_id }}
  message:
    description: Resolution message for a missing or failed lookup.
    value: ${{ steps.resolve.outputs.message }}
  results-file:
    description: Path to the downloaded baseline results JSON.
    value: ${{ steps.paths.outputs.results_file }}
  manifest-file:
    description: Path to the downloaded baseline screenshot manifest.
    value: ${{ steps.paths.outputs.manifest_file }}
  run-dir:
    description: Root directory for the downloaded artifact.
    value: ${{ steps.paths.outputs.run_dir }}
  screenshots-dir:
    description: Root directory containing downloaded baseline screenshots.
    value: ${{ steps.paths.outputs.screenshots_dir }}

runs:
  using: composite
  steps:
    - id: resolve
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        REPO_CONFIG_PATH: ${{ inputs.repo-config-path }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_WORKFLOW_ID: ${{ inputs.workflow-id }}
        INPUT_BRANCH: ${{ inputs.branch }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const { pathToFileURL } = require('url');

          const repository = process.env.INPUT_REPOSITORY || `${context.repo.owner}/${context.repo.repo}`;
          const modulePath = path.resolve(process.env.GITHUB_WORKSPACE, process.env.GITHUB_ACTION_PATH, '..', '..', 'lib', 'snapdrift-config.mjs');
          const resolverModulePath = path.resolve(process.env.GITHUB_WORKSPACE, process.env.GITHUB_ACTION_PATH, '..', '..', 'lib', 'resolve-baseline-artifact.mjs');
          const { loadSnapdriftConfig } = await import(pathToFileURL(modulePath));
          const { resolveBaselineArtifact } = await import(pathToFileURL(resolverModulePath));
          let artifactName = process.env.INPUT_ARTIFACT_NAME || '';

          const setLookupError = (error) => {
            const detail = error instanceof Error ? error.message : String(error);
            const message = `Unable to resolve the SnapDrift baseline artifact: ${detail}`;
            core.setOutput('found', 'false');
            core.setOutput('resolution_status', 'error');
            core.setOutput('artifact_name', artifactName);
            core.setOutput('message', message);
            core.setFailed(message);
          };

          try {
            const { config } = await loadSnapdriftConfig(process.env.REPO_CONFIG_PATH || undefined);
            artifactName = process.env.INPUT_ARTIFACT_NAME || config.baselineArtifactName;
            const result = await resolveBaselineArtifact({
              github,
              repository,
              workflowId: process.env.INPUT_WORKFLOW_ID || 'ci.yml',
              branch: process.env.INPUT_BRANCH || 'main',
              artifactName
            });
            core.setOutput('found', String(result.found));
            core.setOutput('resolution_status', result.resolutionStatus);
            core.setOutput('artifact_name', result.artifactName);
            core.setOutput('head_sha', result.headSha || '');
            core.setOutput('run_id', result.runId || '');
            core.setOutput('message', result.message);
          } catch (error) {
            setLookupError(error);
          }

    - if: steps.resolve.outputs.found == 'true'
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        github-token: ${{ inputs.github-token }}
        repository: ${{ inputs.repository || github.repository }}
        run-id: ${{ steps.resolve.outputs.run_id }}
        name: ${{ steps.resolve.outputs.artifact_name }}
        path: ${{ inputs.download-path }}

    - id: paths
      if: steps.resolve.outputs.found == 'true'
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ inputs.download-path }}
      run: |
        set -euo pipefail
        RESULTS_FILE="$(find "$DOWNLOAD_PATH" -type f -name 'results.json' | head -n 1)"
        MANIFEST_FILE="$(find "$DOWNLOAD_PATH" -type f -name 'manifest.json' | head -n 1)"
        if [ -z "$RESULTS_FILE" ] || [ -z "$MANIFEST_FILE" ]; then
          echo "Downloaded artifact did not contain the expected SnapDrift baseline files."
          find "$DOWNLOAD_PATH" -maxdepth 5 -type f | sort || true
          exit 1
        fi
        {
          echo "results_file=$RESULTS_FILE"
          echo "manifest_file=$MANIFEST_FILE"
          case "$DOWNLOAD_PATH" in
            /*) RUN_DIR="$DOWNLOAD_PATH" ;;
            *) RUN_DIR="${GITHUB_WORKSPACE}/${DOWNLOAD_PATH}" ;;
          esac
          echo "run_dir=$RUN_DIR"
          echo "screenshots_dir=$(dirname "$MANIFEST_FILE")/screenshots"
        } >> "$GITHUB_OUTPUT"
