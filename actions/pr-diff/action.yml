name: SnapDrift PR Diff
description: Run the end-to-end SnapDrift pull request pipeline, including scope resolution, skipped-report handling, artifact upload, PR reporting, and enforcement.

branding:
  icon: eye
  color: purple

inputs:
  github-token:
    description: Token used to inspect pull request files, fetch baselines, and publish SnapDrift PR reports.
    required: true
  repo-config-path:
    description: Path to the SnapDrift config file.
    required: false
    default: .github/snapdrift.json
  pr-number:
    description: Optional pull request number override.
    required: false
    default: ''
  route-ids:
    description: Optional comma-separated route ids. When provided, changed-file scope detection is skipped.
    required: false
    default: ''
  force-run:
    description: Whether to force a full run when route ids are not explicitly provided.
    required: false
    default: 'false'
  force-run-reason:
    description: Reason to report when force-run is enabled.
    required: false
    default: forced
  baseline-repository:
    description: Repository in owner/name format that publishes the baseline.
    required: false
    default: ''
  baseline-workflow-id:
    description: Workflow id or filename to search for the baseline.
    required: false
    default: ci.yml
  baseline-branch:
    description: Branch that publishes the baseline.
    required: false
    default: main
  artifact-retention-days:
    description: Retention period for the uploaded diff artifact.
    required: false
    default: '30'
  comment-on-pr:
    description: Whether to publish the SnapDrift PR report.
    required: false
    default: 'true'
  max-changed-rows:
    description: Maximum number of changed-route rows shown in the PR comment before truncation.
    required: false
    default: '20'
  max-error-rows:
    description: Maximum number of error rows shown in the PR comment before truncation.
    required: false
    default: '10'

outputs:
  should-run:
    description: Whether the SnapDrift flow ran or intentionally skipped due to scope.
    value: ${{ steps.finalize.outputs.should_run }}
  scope-reason:
    description: Reason for the final scope decision.
    value: ${{ steps.finalize.outputs.scope_reason }}
  selected-route-ids:
    description: Comma-separated route ids selected for the run.
    value: ${{ steps.finalize.outputs.selected_route_ids }}
  baseline-found:
    description: Whether a usable baseline was found.
    value: ${{ steps.finalize.outputs.baseline_found }}
  baseline-resolution-status:
    description: 'Baseline lookup status: found, missing, or error.'
    value: ${{ steps.finalize.outputs.baseline_resolution_status }}
  status:
    description: Final SnapDrift status.
    value: ${{ steps.finalize.outputs.status }}
  summary-path:
    description: Path to the final summary JSON file.
    value: ${{ steps.finalize.outputs.summary_path }}
  markdown-path:
    description: Path to the final summary markdown file.
    value: ${{ steps.finalize.outputs.markdown_path }}
  artifact-name:
    description: Uploaded diff artifact name.
    value: ${{ steps.context.outputs.artifact_name }}
  bundle-dir:
    description: Staged diff artifact bundle directory.
    value: ${{ steps.finalize.outputs.bundle_dir }}

runs:
  using: composite
  steps:
    - name: Set action root path
      shell: bash
      run: echo "ACTION_ROOT=$(cd "$GITHUB_ACTION_PATH/../.." && pwd)" >> "$GITHUB_ENV"

    - name: Set up Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: '22'

    - name: Install action dependencies
      shell: bash
      run: npm ci --prefix "$ACTION_ROOT"

    - id: context
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const explicitPrNumber = (process.env.INPUT_PR_NUMBER || '').trim();
          const prNumber = explicitPrNumber || String(context.payload.pull_request?.number || context.issue?.number || '');
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const artifactName = `snapdrift-pr-${prNumber || process.env.GITHUB_RUN_ID}`;

          core.setOutput('pr_number', prNumber);
          core.setOutput('run_url', runUrl);
          core.setOutput('artifact_name', artifactName);

    - id: scope
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        REPO_CONFIG_PATH: ${{ inputs.repo-config-path }}
        ROUTE_IDS: ${{ inputs.route-ids }}
        FORCE_RUN: ${{ inputs.force-run }}
        FORCE_RUN_REASON: ${{ inputs.force-run-reason }}
        INPUT_PR_NUMBER: ${{ steps.context.outputs.pr_number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const { pathToFileURL } = require('url');

          const configModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/snapdrift-config.mjs');
          const { loadSnapdriftConfig, selectConfiguredRoutes, selectRoutesForChangedFiles, splitCommaList } = await import(pathToFileURL(configModulePath));
          const { config } = await loadSnapdriftConfig(process.env.REPO_CONFIG_PATH || undefined);
          const allRouteIds = (config.routes || []).map((route) => route.id);
          const explicitRouteIds = splitCommaList(process.env.ROUTE_IDS);

          function setOutputs(scope) {
            core.setOutput('should_run', scope.shouldRun ? 'true' : 'false');
            core.setOutput('reason', scope.reason);
            core.setOutput('selected_route_ids', (scope.selectedRouteIds || []).join(','));
          }

          if (explicitRouteIds.length > 0) {
            const selected = selectConfiguredRoutes(config, explicitRouteIds);
            setOutputs({
              shouldRun: true,
              reason: 'explicit_route_ids',
              selectedRouteIds: selected.selectedRouteIds
            });
            return;
          }

          if (process.env.FORCE_RUN === 'true') {
            setOutputs({
              shouldRun: true,
              reason: process.env.FORCE_RUN_REASON || 'forced',
              selectedRouteIds: allRouteIds
            });
            return;
          }

          const prNumber = Number(process.env.INPUT_PR_NUMBER || context.payload.pull_request?.number || '');
          if (!Number.isFinite(prNumber) || prNumber <= 0) {
            setOutputs({
              shouldRun: true,
              reason: 'missing_pr_number',
              selectedRouteIds: allRouteIds
            });
            return;
          }

          try {
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            if (!Array.isArray(files)) {
              throw new Error('Malformed GitHub changed-file response: expected an array of file records.');
            }
            for (const [index, file] of files.entries()) {
              if (!file || typeof file !== 'object' || typeof file.filename !== 'string' || file.filename.length === 0) {
                throw new Error(`Malformed GitHub changed-file response: file record ${index} must include a non-empty string filename.`);
              }
            }
            if (files.length >= 3000) {
              core.warning('GitHub returned the maximum 3000 changed-file records; the list may be truncated, so running all configured captures.');
              setOutputs({
                shouldRun: true,
                reason: 'changed_files_truncated',
                selectedRouteIds: allRouteIds
              });
              return;
            }
            const changedFiles = [...new Set(files.flatMap((file) => [
              file.filename,
              ...(file.status === 'renamed' && typeof file.previous_filename === 'string' && file.previous_filename
                ? [file.previous_filename]
                : [])
            ]))];
            setOutputs(
              selectRoutesForChangedFiles(
                config,
                changedFiles
              )
            );
          } catch (error) {
            core.warning(`Unable to inspect PR files for SnapDrift scope; running all configured captures instead. ${error.message}`);
            setOutputs({
              shouldRun: true,
              reason: 'snapdrift_scope_check_failed',
              selectedRouteIds: allRouteIds
            });
          }

    - id: baseline
      if: steps.scope.outputs.should_run == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        REPO_CONFIG_PATH: ${{ inputs.repo-config-path }}
        INPUT_REPOSITORY: ${{ inputs.baseline-repository }}
        INPUT_WORKFLOW_ID: ${{ inputs.baseline-workflow-id }}
        INPUT_BRANCH: ${{ inputs.baseline-branch }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const { pathToFileURL } = require('url');

          const repository = process.env.INPUT_REPOSITORY || `${context.repo.owner}/${context.repo.repo}`;
          const modulePath = path.resolve(process.env.ACTION_ROOT, 'lib/snapdrift-config.mjs');
          const resolverModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/resolve-baseline-artifact.mjs');
          const { loadSnapdriftConfig } = await import(pathToFileURL(modulePath));
          const { resolveBaselineArtifact } = await import(pathToFileURL(resolverModulePath));
          let artifactName = '';

          const setLookupError = (error) => {
            const detail = error instanceof Error ? error.message : String(error);
            const message = `Unable to resolve the SnapDrift baseline artifact: ${detail}`;
            core.setOutput('found', 'false');
            core.setOutput('resolution_status', 'error');
            core.setOutput('artifact_name', artifactName);
            core.setOutput('message', message);
            core.warning(message);
          };

          try {
            const { config } = await loadSnapdriftConfig(process.env.REPO_CONFIG_PATH || undefined);
            artifactName = config.baselineArtifactName;
            const result = await resolveBaselineArtifact({
              github,
              repository,
              workflowId: process.env.INPUT_WORKFLOW_ID || 'ci.yml',
              branch: process.env.INPUT_BRANCH || 'main',
              artifactName
            });
            core.setOutput('found', String(result.found));
            core.setOutput('resolution_status', result.resolutionStatus);
            core.setOutput('artifact_name', result.artifactName);
            core.setOutput('head_sha', result.headSha || '');
            core.setOutput('run_id', result.runId || '');
            core.setOutput('message', result.message);
          } catch (error) {
            setLookupError(error);
          }

    - if: steps.scope.outputs.should_run == 'true' && steps.baseline.outputs.found == 'true'
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        github-token: ${{ inputs.github-token }}
        repository: ${{ inputs.baseline-repository || github.repository }}
        run-id: ${{ steps.baseline.outputs.run_id }}
        name: ${{ steps.baseline.outputs.artifact_name }}
        path: snapdrift-baseline-download

    - id: baseline_paths
      if: steps.scope.outputs.should_run == 'true' && steps.baseline.outputs.found == 'true'
      shell: bash
      run: |
        set -euo pipefail
        RESULTS_FILE="$(find snapdrift-baseline-download -type f -name 'results.json' | head -n 1)"
        MANIFEST_FILE="$(find snapdrift-baseline-download -type f -name 'manifest.json' | head -n 1)"
        if [ -z "$RESULTS_FILE" ] || [ -z "$MANIFEST_FILE" ]; then
          echo "Downloaded artifact did not contain the expected SnapDrift baseline files."
          find snapdrift-baseline-download -maxdepth 5 -type f | sort || true
          exit 1
        fi
        {
          echo "results_file=$RESULTS_FILE"
          echo "manifest_file=$MANIFEST_FILE"
          echo "run_dir=${GITHUB_WORKSPACE}/snapdrift-baseline-download"
          echo "screenshots_dir=$(dirname "$MANIFEST_FILE")/screenshots"
        } >> "$GITHUB_OUTPUT"

    - id: config
      if: steps.scope.outputs.should_run == 'true'
      shell: bash
      env:
        REPO_CONFIG_PATH: ${{ inputs.repo-config-path }}
      run: |
        node --input-type=module <<'EOF'
        import fs from 'node:fs/promises';
        import path from 'node:path';
        import { pathToFileURL } from 'node:url';
        const configModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/snapdrift-config.mjs');
        const providerModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/provider.mjs');
        const { loadSnapdriftConfig } = await import(pathToFileURL(configModulePath));
        const { isLocalBaseUrl } = await import(pathToFileURL(providerModulePath));
        const { config } = await loadSnapdriftConfig(process.env.REPO_CONFIG_PATH || undefined);
        const outputs = [
          `provider=${config.provider || 'local'}`,
          `on_unavailable=${config.snap?.onUnavailable || 'fail'}`,
          `snap_local_capture=${(config.provider || 'local') === 'snap' && isLocalBaseUrl(config.baseUrl) ? 'true' : 'false'}`
        ].join('\n') + '\n';
        await fs.appendFile(process.env.GITHUB_OUTPUT, outputs);
        EOF

    - id: baseline_resolution_guard
      if: steps.scope.outputs.should_run == 'true' && steps.baseline.outputs.resolution_status == 'error' && steps.config.outputs.provider != 'snap'
      shell: bash
      env:
        BASELINE_MESSAGE: ${{ steps.baseline.outputs.message }}
      run: |
        set -euo pipefail
        printf 'SnapDrift baseline lookup failed. %s\n' "$BASELINE_MESSAGE" >&2
        exit 1

    - name: Install Playwright Chromium
      if: steps.scope.outputs.should_run == 'true' && (steps.config.outputs.provider != 'snap' || steps.config.outputs.on_unavailable == 'fallback-local' || steps.config.outputs.snap_local_capture == 'true')
      shell: bash
      run: |
        "$ACTION_ROOT/node_modules/.bin/playwright" install --with-deps chromium

    - id: capture
      if: steps.scope.outputs.should_run == 'true'
      shell: bash
      env:
        REPO_CONFIG_PATH: ${{ inputs.repo-config-path }}
        ROUTE_IDS: ${{ steps.scope.outputs.selected_route_ids }}
        BASELINE_RESOLUTION_STATUS: ${{ steps.baseline.outputs.resolution_status }}
        BASELINE_RESOLUTION_MESSAGE: ${{ steps.baseline.outputs.message }}
      run: |
        node --input-type=module <<'EOF'
        import fs from 'node:fs/promises';
        import path from 'node:path';
        import { pathToFileURL } from 'node:url';

        const providerModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/provider.mjs');
        const configModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/snapdrift-config.mjs');
        const policyModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/outage-policy.mjs');
        const summaryModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/drift-summary.mjs');
        const { createProvider } = await import(pathToFileURL(providerModulePath));
        const { loadSnapdriftConfig, splitCommaList } = await import(pathToFileURL(configModulePath));
        const { captureWithPolicy, SNAP_UNAVAILABLE_REASON } = await import(pathToFileURL(policyModulePath));
        const { writeDriftSummary } = await import(pathToFileURL(summaryModulePath));

        const { config } = await loadSnapdriftConfig(process.env.REPO_CONFIG_PATH || undefined);
        const providerName = config.provider || 'local';
        const routeIds = splitCommaList(process.env.ROUTE_IDS);

        const captured = await captureWithPolicy({
          provider: createProvider(providerName, config),
          providerName,
          config,
          captureOptions: {
            configPath: process.env.REPO_CONFIG_PATH || undefined,
            routeIds
          },
          baselineResolutionStatus: process.env.BASELINE_RESOLUTION_STATUS,
          baselineResolutionMessage: process.env.BASELINE_RESOLUTION_MESSAGE,
          onSkip: () => process.stderr.write('[SnapDrift] Snap unavailable — skipping visual regression (warn-and-skip).\n'),
          onFallback: () => process.stderr.write('[SnapDrift] Snap unavailable — falling back to local provider.\n')
        });

        if (captured.outcome === 'skipped') {
          // warn-and-skip is documented as "write a skipped summary and exit 0".
          // Without the summary the report step falls through to its
          // "Capture Failed" body, which is not what happened. See #125.
          const skipped = await writeDriftSummary({
            reason: SNAP_UNAVAILABLE_REASON,
            selectedRouteIds: routeIds
          });
          const skipOutputs = [
            `provider=skipped`,
            `summary_path=${skipped.summaryPath}`,
            `markdown_path=${skipped.markdownPath}`,
            `status=${skipped.summary.status || ''}`
          ].join('\n') + '\n';
          await fs.appendFile(process.env.GITHUB_OUTPUT, skipOutputs);
          process.exit(0);
        }

        const result = captured.result;
        const outputs = [
          // The *effective* provider, not the configured one: after a
          // fallback-local capture the compare step must not rebuild
          // SnapProvider around local results that carry no run id.
          `provider=${captured.providerName}`,
          `local_screenshots=${captured.localScreenshots ? 'true' : 'false'}`,
          `results_file=${result.resultsPath}`,
          `manifest_file=${result.manifestPath}`,
          `screenshots_root=${result.screenshotsRoot}`,
          `selected_route_ids=${result.selectedRouteIds.join(',')}`
        ].join('\n') + '\n';

        await fs.appendFile(process.env.GITHUB_OUTPUT, outputs);
        EOF

    - id: compare
      if: steps.scope.outputs.should_run == 'true' && steps.capture.outputs.provider != 'skipped' && (steps.baseline.outputs.found == 'true' || steps.capture.outputs.provider == 'snap')
      shell: bash
      env:
        REPO_CONFIG_PATH: ${{ inputs.repo-config-path }}
        ROUTE_IDS: ${{ steps.scope.outputs.selected_route_ids }}
        BASELINE_RESULTS_PATH: ${{ steps.baseline_paths.outputs.results_file }}
        BASELINE_MANIFEST_PATH: ${{ steps.baseline_paths.outputs.manifest_file }}
        BASELINE_RUN_DIR: ${{ steps.baseline_paths.outputs.run_dir }}
        BASELINE_ARTIFACT_NAME: ${{ steps.baseline.outputs.artifact_name }}
        BASELINE_SOURCE_SHA: ${{ steps.baseline.outputs.head_sha }}
        CURRENT_RESULTS_PATH: ${{ steps.capture.outputs.results_file }}
        CURRENT_MANIFEST_PATH: ${{ steps.capture.outputs.manifest_file }}
        CURRENT_SCREENSHOTS_ROOT: ${{ steps.capture.outputs.screenshots_root }}
        CAPTURE_PROVIDER: ${{ steps.capture.outputs.provider }}
        LOCAL_SCREENSHOTS: ${{ steps.capture.outputs.local_screenshots }}
        BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
        BASELINE_RESOLUTION_STATUS: ${{ steps.baseline.outputs.resolution_status }}
        BASELINE_RESOLUTION_MESSAGE: ${{ steps.baseline.outputs.message }}
      run: |
        node --input-type=module <<'EOF'
        import fs from 'node:fs/promises';
        import path from 'node:path';
        import { pathToFileURL } from 'node:url';

        const providerModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/provider.mjs');
        const configModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/snapdrift-config.mjs');
        const policyModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/outage-policy.mjs');
        const summaryModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/drift-summary.mjs');
        const { createProvider } = await import(pathToFileURL(providerModulePath));
        const { loadSnapdriftConfig, splitCommaList } = await import(pathToFileURL(configModulePath));
        const { diffWithPolicy, MISSING_BASELINE_REASON, SNAP_UNAVAILABLE_REASON } = await import(pathToFileURL(policyModulePath));
        const { writeDriftSummary } = await import(pathToFileURL(summaryModulePath));

        const { config } = await loadSnapdriftConfig(process.env.REPO_CONFIG_PATH || undefined);
        // The capture step reports the provider that actually ran, which is
        // "local" once a fallback-local capture has happened.
        const providerName = process.env.CAPTURE_PROVIDER || config.provider || 'local';
        const routeIds = splitCommaList(process.env.ROUTE_IDS);

        const resolvedOutDir = path.resolve('qa-artifacts/snapdrift/drift/current');
        const resolvedSummaryPath = path.join(resolvedOutDir, 'summary.json');
        const resolvedMarkdownPath = path.join(resolvedOutDir, 'summary.md');
        const resolvedDiffImagesDir = path.join(resolvedOutDir, 'diffs');

        const captureOptions = {
          configPath: process.env.REPO_CONFIG_PATH || undefined,
          routeIds
        };

        const diffOptions = {
          configPath: process.env.REPO_CONFIG_PATH || undefined,
          baselineResultsPath: process.env.BASELINE_RESULTS_PATH || undefined,
          baselineManifestPath: process.env.BASELINE_MANIFEST_PATH || undefined,
          baselineRunDir: process.env.BASELINE_RUN_DIR || undefined,
          routeIds,
          baselineArtifactName: process.env.BASELINE_ARTIFACT_NAME || undefined,
          baselineSourceSha: process.env.BASELINE_SOURCE_SHA || undefined,
          currentResultsPath: process.env.CURRENT_RESULTS_PATH || undefined,
          currentManifestPath: process.env.CURRENT_MANIFEST_PATH || undefined,
          currentRunDir: process.env.CURRENT_SCREENSHOTS_ROOT || undefined,
          diffImagesDir: resolvedDiffImagesDir
        };

        const diffed = await diffWithPolicy({
          provider: createProvider(providerName, config),
          providerName,
          diffOptions,
          captureOptions,
          localScreenshots: process.env.LOCAL_SCREENSHOTS !== 'false',
          baselineAvailable: process.env.BASELINE_FOUND === 'true',
          baselineResolutionStatus: process.env.BASELINE_RESOLUTION_STATUS,
          baselineResolutionMessage: process.env.BASELINE_RESOLUTION_MESSAGE,
          onSkip: () => process.stderr.write('[SnapDrift] Snap unavailable during diff — skipping (warn-and-skip).\n'),
          onFallback: () => process.stderr.write('[SnapDrift] Snap unavailable during diff — falling back to local provider.\n'),
          onRecapture: () => process.stderr.write('[SnapDrift] The current capture was rendered by Snap, so it has no local screenshots — recapturing locally before diffing.\n'),
          onBaselineUnavailable: () => {
            if (process.env.BASELINE_RESOLUTION_STATUS === 'error') {
              process.stderr.write(`[SnapDrift] ${process.env.BASELINE_RESOLUTION_MESSAGE || 'The GitHub baseline lookup failed before local diff fallback.'}\n`);
              return;
            }
            process.stderr.write('[SnapDrift] No baseline artifact is available, so the local diff cannot run.\n');
          }
        });

        // Every non-throwing outcome writes a summary. A wrapper run that ends
        // without one makes the report step claim "Capture Failed". See #125.
        if (diffed.outcome !== 'diffed') {
          const skipped = await writeDriftSummary({
            reason: diffed.outcome === 'skipped' ? SNAP_UNAVAILABLE_REASON : MISSING_BASELINE_REASON,
            baselineAvailable: diffed.outcome === 'skipped' ? undefined : false,
            currentResultsPath: process.env.CURRENT_RESULTS_PATH || undefined,
            selectedRouteIds: routeIds,
            outDir: resolvedOutDir
          });
          const skipOutputs = [
            `skipped=true`,
            `summary_path=${skipped.summaryPath}`,
            `markdown_path=${skipped.markdownPath}`,
            `status=${skipped.summary.status || ''}`
          ].join('\n') + '\n';
          await fs.appendFile(process.env.GITHUB_OUTPUT, skipOutputs);
          process.exit(0);
        }

        const { summary, markdown } = diffed.result;

        await fs.mkdir(resolvedOutDir, { recursive: true });
        await Promise.all([
          fs.writeFile(resolvedSummaryPath, JSON.stringify(summary, null, 2)),
          fs.writeFile(resolvedMarkdownPath, markdown)
        ]);

        const outputs = [
          `skipped=false`,
          `summary_path=${resolvedSummaryPath}`,
          `markdown_path=${resolvedMarkdownPath}`,
          `status=${summary.status || ''}`,
          // A fallback-local diff of a remote Snap capture recaptures on the
          // runner; the staged bundle has to carry those PNGs, not the empty
          // placeholder paths the Snap capture step emitted.
          `current_results_file=${diffed.recapture?.resultsPath || ''}`,
          `current_manifest_file=${diffed.recapture?.manifestPath || ''}`,
          `current_screenshots_root=${diffed.recapture?.screenshotsRoot || ''}`
        ].join('\n') + '\n';

        await fs.appendFile(process.env.GITHUB_OUTPUT, outputs);
        EOF

    - id: skipped_scope
      if: steps.scope.outputs.should_run != 'true'
      shell: bash
      env:
        REASON: ${{ steps.scope.outputs.reason }}
      run: |
        node --input-type=module <<'EOF'
        import fs from 'node:fs/promises';
        import path from 'node:path';
        import { pathToFileURL } from 'node:url';

        const modulePath = path.resolve(process.env.ACTION_ROOT, 'lib/drift-summary.mjs');
        const { writeDriftSummary } = await import(pathToFileURL(modulePath));

        const result = await writeDriftSummary({
          reason: process.env.REASON || 'no_snapdrift_relevant_changes',
          selectedRouteIds: []
        });

        const outputs = [
          `summary_path=${result.summaryPath}`,
          `markdown_path=${result.markdownPath}`,
          `status=${result.summary.status || ''}`
        ].join('\n') + '\n';

        await fs.appendFile(process.env.GITHUB_OUTPUT, outputs);
        EOF

    - id: skipped_baseline
      if: steps.scope.outputs.should_run == 'true' && steps.baseline.outputs.resolution_status == 'missing' && steps.capture.outputs.provider != 'snap' && steps.capture.outputs.provider != 'skipped'
      shell: bash
      env:
        MESSAGE: ${{ steps.baseline.outputs.message }}
        CURRENT_RESULTS_PATH: ${{ steps.capture.outputs.results_file }}
        SELECTED_ROUTE_IDS: ${{ steps.scope.outputs.selected_route_ids }}
      run: |
        node --input-type=module <<'EOF'
        import fs from 'node:fs/promises';
        import path from 'node:path';
        import { pathToFileURL } from 'node:url';

        const modulePath = path.resolve(process.env.ACTION_ROOT, 'lib/drift-summary.mjs');
        const { writeDriftSummary } = await import(pathToFileURL(modulePath));

        const result = await writeDriftSummary({
          reason: 'missing_main_baseline_artifact',
          message: process.env.MESSAGE || undefined,
          baselineAvailable: false,
          currentResultsPath: process.env.CURRENT_RESULTS_PATH || undefined,
          selectedRouteIds: process.env.SELECTED_ROUTE_IDS || ''
        });

        const outputs = [
          `summary_path=${result.summaryPath}`,
          `markdown_path=${result.markdownPath}`,
          `status=${result.summary.status || ''}`
        ].join('\n') + '\n';

        await fs.appendFile(process.env.GITHUB_OUTPUT, outputs);
        EOF

    - id: stage
      shell: bash
      env:
        SUMMARY_JSON_PATH: ${{ steps.compare.outputs.summary_path || steps.capture.outputs.summary_path || steps.skipped_baseline.outputs.summary_path || steps.skipped_scope.outputs.summary_path }}
        SUMMARY_MARKDOWN_PATH: ${{ steps.compare.outputs.markdown_path || steps.capture.outputs.markdown_path || steps.skipped_baseline.outputs.markdown_path || steps.skipped_scope.outputs.markdown_path }}
        BASELINE_RESULTS_PATH: ${{ steps.baseline_paths.outputs.results_file }}
        CURRENT_RESULTS_PATH: ${{ steps.compare.outputs.current_results_file || steps.capture.outputs.results_file }}
        BASELINE_MANIFEST_PATH: ${{ steps.baseline_paths.outputs.manifest_file }}
        CURRENT_MANIFEST_PATH: ${{ steps.compare.outputs.current_manifest_file || steps.capture.outputs.manifest_file }}
        BASELINE_SCREENSHOTS_DIR: ${{ steps.baseline_paths.outputs.screenshots_dir }}
        CURRENT_SCREENSHOTS_ROOT: ${{ steps.compare.outputs.current_screenshots_root || steps.capture.outputs.screenshots_root }}
        DIFF_IMAGES_DIR: ${{ steps.compare.outputs.diff_images_dir }}
      run: |
        node --input-type=module <<'EOF'
        import fs from 'node:fs/promises';
        import path from 'node:path';
        import { pathToFileURL } from 'node:url';

        const modulePath = path.resolve(process.env.ACTION_ROOT, 'lib/stage-artifacts.mjs');
        const { stageArtifacts } = await import(pathToFileURL(modulePath));

        const currentScreenshotsRoot = process.env.CURRENT_SCREENSHOTS_ROOT || '';

        const result = await stageArtifacts({
          artifactType: 'diff',
          summaryJsonPath: process.env.SUMMARY_JSON_PATH || undefined,
          summaryMarkdownPath: process.env.SUMMARY_MARKDOWN_PATH || undefined,
          baselineResultsPath: process.env.BASELINE_RESULTS_PATH || undefined,
          currentResultsPath: process.env.CURRENT_RESULTS_PATH || undefined,
          baselineManifestPath: process.env.BASELINE_MANIFEST_PATH || undefined,
          currentManifestPath: process.env.CURRENT_MANIFEST_PATH || undefined,
          baselineScreenshotsDir: process.env.BASELINE_SCREENSHOTS_DIR || undefined,
          currentScreenshotsDir: currentScreenshotsRoot ? path.join(currentScreenshotsRoot, 'screenshots') : undefined,
          diffImagesDir: process.env.DIFF_IMAGES_DIR || undefined
        });

        await fs.appendFile(process.env.GITHUB_OUTPUT, `bundle_dir=${result.bundleDir}\n`);
        EOF

    - id: upload
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ steps.context.outputs.artifact_name }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: warn
        path: ${{ steps.stage.outputs.bundle_dir }}

    - if: always()
      shell: bash
      env:
        SUMMARY_FILE: ${{ steps.compare.outputs.markdown_path || steps.capture.outputs.markdown_path || steps.skipped_baseline.outputs.markdown_path || steps.skipped_scope.outputs.markdown_path }}
      run: |
        if [ -f "$SUMMARY_FILE" ]; then
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
        fi

    - if: always() && inputs.comment-on-pr == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        SUMMARY_PATH: ${{ steps.compare.outputs.summary_path || steps.capture.outputs.summary_path || steps.skipped_baseline.outputs.summary_path || steps.skipped_scope.outputs.summary_path }}
        ARTIFACT_NAME: ${{ steps.context.outputs.artifact_name }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        RUN_URL: ${{ steps.context.outputs.run_url }}
        REPO_CONFIG_PATH: ${{ inputs.repo-config-path }}
        MAX_CHANGED_ROWS: ${{ inputs.max-changed-rows }}
        MAX_ERROR_ROWS: ${{ inputs.max-error-rows }}
        BASELINE_RESOLUTION_STATUS: ${{ steps.baseline.outputs.resolution_status }}
        BASELINE_RESOLUTION_MESSAGE: ${{ steps.baseline.outputs.message }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');

          const PR_COMMENT_MARKER = '<!-- snapdrift-report -->';
          const PR_COMMENT_MARKERS = [PR_COMMENT_MARKER];
          const iconUrl = 'https://raw.githubusercontent.com/ranacseruet/snapdrift/main/assets/snapdrift-logo-icon.png';
          const repoUrl = 'https://github.com/ranacseruet/snapdrift';
          const prCommentModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/pr-comment.mjs');
          const { escapeMarkdown } = await import(pathToFileURL(prCommentModulePath));

          const summaryPath = process.env.SUMMARY_PATH;
          const issueNumber = Number(process.env.PR_NUMBER || context.payload.pull_request?.number || context.issue?.number || '');
          if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
            core.warning('SnapDrift PR report skipped because no pull request number was available.');
            return;
          }

          if (!summaryPath || !fs.existsSync(summaryPath)) {
            const runUrl = process.env.RUN_URL || '';
            const lookupFailure = process.env.BASELINE_RESOLUTION_STATUS === 'error';
            const heading = lookupFailure ? 'Baseline Lookup Failed' : 'Capture Failed';
            const detail = escapeMarkdown(lookupFailure
              ? process.env.BASELINE_RESOLUTION_MESSAGE || 'The GitHub baseline lookup failed before comparison could run.'
              : 'SnapDrift did not produce a summary. This usually means capture failed before the report could be assembled.');
            const body = `${PR_COMMENT_MARKER}\n<img src="${iconUrl}" alt="SnapDrift" width="20" height="20" />\n\n### ⚠️ SnapDrift Report — ${heading}\n\n${detail}\n\n[View run](${runUrl}) for details.\n\n<div align="right"><sub>Powered by <a href="${repoUrl}">SnapDrift</a></sub></div>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
            return;
          }

          const providerModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/provider.mjs');
          const configModulePath = path.resolve(process.env.ACTION_ROOT, 'lib/snapdrift-config.mjs');
          const { createProvider } = await import(pathToFileURL(providerModulePath));
          const { loadSnapdriftConfig } = await import(pathToFileURL(configModulePath));

          // Provider-loading block duplicated in actions/comment/action.yml — keep in sync.
          let provider;
          try {
            const { config } = await loadSnapdriftConfig(process.env.REPO_CONFIG_PATH || undefined);
            provider = createProvider(config.provider || 'local', config);
          } catch (err) {
            core.warning(`Could not load SnapDrift config; falling back to LocalProvider. ${err.message}`);
            provider = createProvider('local');
          }

          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const maxChangedRows = Number(process.env.MAX_CHANGED_ROWS) || 20;
          const maxErrorRows = Number(process.env.MAX_ERROR_ROWS) || 10;
          const body = provider.buildCommentBody(summary, {
            artifactName: process.env.ARTIFACT_NAME || '',
            artifactUrl: process.env.ARTIFACT_URL || '',
            runUrl: process.env.RUN_URL || '',
            maxChangedRows,
            maxErrorRows
          });

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
            per_page: 100
          });
          const matchingComments = comments
            .filter((comment) => comment.body && PR_COMMENT_MARKERS.some((marker) => comment.body.includes(marker)))
            .sort((left, right) => {
              const leftTime = new Date(left.updated_at || left.created_at).getTime();
              const rightTime = new Date(right.updated_at || right.created_at).getTime();
              return rightTime - leftTime;
            });
          const existing = matchingComments[0];

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
          }

          for (const duplicate of matchingComments.slice(1)) {
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: duplicate.id
            });
          }

    # A skipped compare writes a summary with no diff counters, so enforcement
    # has nothing to evaluate — `warn-and-skip` means "do not fail my build".
    - if: steps.scope.outputs.should_run == 'true' && steps.capture.outputs.provider != 'skipped' && steps.compare.outputs.skipped != 'true' && (steps.baseline.outputs.found == 'true' || steps.capture.outputs.provider == 'snap')
      shell: bash
      run: |
        node --input-type=module <<'EOF'
        import fs from 'node:fs/promises';
        import path from 'node:path';
        import { pathToFileURL } from 'node:url';

        const modulePath = path.resolve(process.env.ACTION_ROOT, 'lib/compare-results.mjs');
        const { shouldFailDriftCheck, formatDriftFailureMessage } = await import(pathToFileURL(modulePath));
        const summaryModulePath = path.resolve('qa-artifacts/snapdrift/drift/current/summary.json');
        const summary = JSON.parse(await fs.readFile(summaryModulePath, 'utf8'));

        if (shouldFailDriftCheck(summary)) {
          throw new Error(formatDriftFailureMessage(summary.diffMode, summary));
        }
        EOF

    - id: finalize
      if: always()
      shell: bash
      env:
        SHOULD_RUN: ${{ steps.scope.outputs.should_run }}
        SCOPE_REASON: ${{ steps.scope.outputs.reason }}
        SELECTED_ROUTE_IDS: ${{ steps.scope.outputs.selected_route_ids }}
        BASELINE_FOUND: ${{ steps.baseline.outputs.found || 'false' }}
        BASELINE_RESOLUTION_STATUS: ${{ steps.baseline.outputs.resolution_status || '' }}
        STATUS: ${{ steps.compare.outputs.status || steps.capture.outputs.status || steps.skipped_baseline.outputs.status || steps.skipped_scope.outputs.status || '' }}
        SUMMARY_PATH: ${{ steps.compare.outputs.summary_path || steps.capture.outputs.summary_path || steps.skipped_baseline.outputs.summary_path || steps.skipped_scope.outputs.summary_path || '' }}
        MARKDOWN_PATH: ${{ steps.compare.outputs.markdown_path || steps.capture.outputs.markdown_path || steps.skipped_baseline.outputs.markdown_path || steps.skipped_scope.outputs.markdown_path || '' }}
        BUNDLE_DIR: ${{ steps.stage.outputs.bundle_dir }}
      run: |
        {
          echo "should_run=${SHOULD_RUN:-false}"
          echo "scope_reason=${SCOPE_REASON:-}"
          echo "selected_route_ids=${SELECTED_ROUTE_IDS:-}"
          echo "baseline_found=${BASELINE_FOUND:-false}"
          echo "baseline_resolution_status=${BASELINE_RESOLUTION_STATUS:-}"
          echo "status=${STATUS:-}"
          echo "summary_path=${SUMMARY_PATH:-}"
          echo "markdown_path=${MARKDOWN_PATH:-}"
          echo "bundle_dir=${BUNDLE_DIR:-}"
        } >> "$GITHUB_OUTPUT"
